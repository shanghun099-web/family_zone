<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Familygram · 우리 가족</title>
<meta name="theme-color" content="#F7F6F3"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2"/>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Familygram"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Dancing+Script:wght@700&family=Nanum+Pen+Script&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
  /* 앱 설치 신호는 화면 코드(babel)가 뜨기 전에 올 수 있어서 여기서 먼저 받아 둔다 */
  window.__inst = null;
  addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__inst = e; dispatchEvent(new Event('fz-inst')); });
  addEventListener('appinstalled', function () { window.__inst = null; window.__installed = true; dispatchEvent(new Event('fz-inst')); });
</script>
<style>
  :root{--ink:#1a1a1a;--sub:#737373;--line:#ececec;--soft:#f5f3ef;--accent:#F0603A;--blue:#2F7BF6;--purple:#6a3fc8;--red:#ED4956;--tag:#1F6FD1;
    --bg:#F7F6F3;--card-sh:0 1px 2px rgba(0,0,0,.04),0 6px 22px rgba(60,40,20,.06);
    --ring:linear-gradient(45deg,#FFC24B,#FA6E3C 35%,#E1306C 65%,#B03BC9);--bday:conic-gradient(#FFD34D,#7FD1AE,#6BA9FF,#C38BFF,#FF8FA3,#FFD34D)}
  html{font-size:16px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#ECE9E4;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  img{display:block}
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(247,246,243,.94);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 14px;min-height:56px}
  .page .topbar{background:rgba(255,255,255,.96)}
  .logo{font-family:'Nanum Pen Script',cursive;font-size:2.2rem;line-height:1}
  .brand{font-family:'Dancing Script',cursive;font-weight:700;font-size:2.15rem;line-height:1;letter-spacing:-.3px;display:inline-flex;align-items:flex-start;gap:3px;color:#151515}
  .brand-hd{padding:12px 8px 4px 18px;align-items:flex-start}
  .brand-sub{display:block;font-size:.86rem;color:#8a8580;margin-top:6px;letter-spacing:-.2px}
  .gate .brand{font-size:3.2rem}
  .h1{font-size:1.35rem;font-weight:900}
  .pt{font-size:1.1rem;font-weight:700;flex:1;text-align:center}
  .iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;position:relative;flex-shrink:0}
  .iconbtn:active{background:#f0f0f0}
  .cnt{position:absolute;top:3px;right:1px;background:#F0403A;color:#fff;border-radius:10px;font-size:.7rem;font-weight:700;min-width:19px;height:19px;padding:0 5px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;line-height:1}
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #efedea;border-radius:20px 20px 0 0;box-shadow:0 -4px 18px rgba(60,40,20,.05);display:flex;align-items:stretch;height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);z-index:30}
  .tabbar>button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;color:#8e8e8e;position:relative}
  .tabbar>button.on{color:var(--ink);font-weight:700}
  .tabbar .cnt{top:5px;right:calc(50% - 24px)}
  .tabbar .me-av{border-radius:50%;padding:1.5px;border:1.5px solid transparent;display:flex}
  .tabbar button.on .me-av{border-color:var(--ink)}
  .muted{color:var(--sub)} .small{font-size:.85rem} .tiny{font-size:.78rem}
  .row{display:flex;align-items:center} .gap{gap:8px} .grow{flex:1;min-width:0}
  .pad{padding:0 14px}
  .empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:1rem}
  .spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .8s linear infinite;display:inline-block}
  .spin.dark{border-color:#ddd;border-top-color:#555}
  @keyframes sp{to{transform:rotate(360deg)}}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* 아바타 */
  .av{display:inline-flex;border-radius:50%;flex-shrink:0;position:relative}
  .av-in{border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;line-height:1}
  .av-in img{width:100%;height:100%;object-fit:cover}
  .av.ring{background:var(--ring)} .av.ring.bday{background:var(--bday)}
  .av.ring.plain{background:linear-gradient(45deg,#FFD7B5,#FFB3C9 50%,#D7BFFF)}
  .av.ring.seen{background:linear-gradient(45deg,#E4DED8,#CFC8C1)}
  .av-gap{border-radius:50%;padding:2px;background:#fff;display:flex}

  /* 스토리 줄 */
  .stories{display:flex;gap:12px;padding:10px 16px 14px;overflow-x:auto;scrollbar-width:none}
  .stories::-webkit-scrollbar{display:none}
  .st{width:70px;text-align:center;flex-shrink:0;position:relative}
  .st .lb{font-size:.82rem;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#262626}
  .st .me0{width:68px;height:68px;border-radius:50%;background:#EEF0F3;color:#7d8590;display:flex;align-items:center;justify-content:center;margin:0 auto}
  .st .mini{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:#fff;border-radius:9px;font-size:.68rem;font-weight:900;padding:0 5px;color:#7b4bd1;border:1px solid #e3d8f7;white-space:nowrap}
  .st .addp{position:absolute;top:48px;right:0;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center}

  /* 카드 줄 */
  .banner{margin:0 12px 10px;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;width:calc(100% - 24px);text-align:left;background:#fff;box-shadow:var(--card-sh)}
  .banner b{display:block;font-size:1rem} .banner span{font-size:.88rem;color:var(--sub)}
  .banner .bic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .banner>span:last-child{color:#b5b0aa}
  .ago .th{display:flex;flex-shrink:0}.ago .th img{width:42px;height:42px;border-radius:10px;object-fit:cover;border:2px solid #fff;margin-left:-12px}
  .ago .th img:first-child{margin-left:0}

  /* 게시물 = 하얀 둥근 카드 */
  .post{background:#fff;border-radius:22px;margin:0 12px 14px;overflow:hidden;box-shadow:var(--card-sh);padding-bottom:12px}
  .page .post{box-shadow:none;margin:0;border-radius:0}
  .post-hd{display:flex;align-items:center;gap:11px;padding:12px 6px 10px 14px}
  .post-hd b{font-size:1.02rem}
  .post-hd .when{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--sub);margin-top:1px}
  .ovl{position:absolute;top:9%;right:6%;max-width:62%;text-align:right;font-family:'Nanum Pen Script',cursive;font-size:2rem;line-height:1.05;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.35);transform:rotate(-6deg);pointer-events:none;white-space:pre-wrap}
  .htag{color:var(--tag);font-weight:500}
  .htags{padding:2px 14px 0;display:flex;flex-wrap:wrap;gap:2px 8px;font-size:.98rem}
  .newdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:2px}
  .car-wrap{position:relative;background:#f2f2f2;user-select:none}
  .car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .car::-webkit-scrollbar{display:none}
  .car img{width:100%;flex-shrink:0;scroll-snap-align:start;object-fit:cover;height:100%}
  .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:5px;justify-content:center;pointer-events:none}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55)} .dots i.on{background:#fff}
  .pcount{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:.78rem;border-radius:12px;padding:2px 9px}
  .bigheart{position:absolute;left:50%;top:50%;animation:pop .8s ease-out forwards;pointer-events:none;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
  .acts{display:flex;align-items:center;padding:4px 6px 0}
  .liked{display:flex;align-items:center;gap:7px;padding:2px 14px;font-size:.95rem;min-height:28px}
  .faces{display:flex}.faces .av{margin-left:-8px;border:2px solid #fff;border-radius:50%}.faces .av:first-child{margin-left:0}
  .capt{padding:4px 14px;font-size:1.02rem;line-height:1.6;white-space:pre-wrap}
  .capt .more{color:var(--sub)}
  .withline{padding:0 14px;font-size:.88rem;color:var(--sub)}
  .askbox{margin:8px 14px 2px;background:#FFF8F0;border:1px solid #F6D6BF;border-radius:14px;padding:10px 12px}
  .askbox .q{font-size:1rem;font-weight:700;margin:2px 0 6px}
  .ans{background:#fff;border-radius:10px;padding:8px 10px;margin-top:6px}
  .cmts{padding:4px 14px 0}
  .linkbtn{color:var(--sub);font-size:.92rem;padding:6px 0;min-height:36px}
  .cmt{display:flex;gap:9px;padding:6px 0;align-items:flex-start}
  .cmt .body{flex:1;min-width:0;font-size:.97rem}
  .cmt .meta{font-size:.78rem;color:var(--sub);margin-top:2px;display:flex;gap:10px}
  .tag-ans{display:inline-block;font-size:.72rem;font-weight:700;color:#b2502c;background:#FFE7DC;border-radius:6px;padding:0 6px;margin-right:4px}
  .locked{margin:10px 14px;border-radius:18px;background:linear-gradient(135deg,#F3EEFF,#FCE9F1);padding:18px;text-align:center}
  .locked .lk{width:56px;height:56px;border-radius:50%;background:#fff;color:var(--purple);display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
  .locked b{font-size:1.05rem;display:block} .locked p{margin:4px 0 0;color:#6a5a8c;font-size:.95rem}
  .opened{display:inline-block;margin:0 14px 4px;background:#FFF1C9;color:#8a5a00;border-radius:8px;font-size:.8rem;font-weight:700;padding:2px 8px}

  /* 목소리 */
  .vp{display:flex;align-items:center;gap:8px;background:#F4F1FF;border-radius:22px;padding:5px 12px 5px 5px;max-width:280px;margin:4px 0}
  .vp-b{width:34px;height:34px;border-radius:50%;background:#7b4bd1;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .wave{flex:1;height:18px;background:repeating-linear-gradient(90deg,#cbbdf0 0 3px,transparent 3px 6px);border-radius:3px;position:relative;overflow:hidden;min-width:60px}
  .wave i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,#7b4bd1 0 3px,transparent 3px 6px)}
  .vp small{font-size:.8rem;color:#5b4a86;min-width:32px;text-align:right}
  .recbox{background:#FFF1EC;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
  .recdot{width:12px;height:12px;border-radius:50%;background:#F0403A;animation:blink 1s infinite;display:inline-block}
  @keyframes blink{50%{opacity:.25}}
  .live{color:#7a4a3a;font-size:.95rem;min-height:1.4em}

  /* 버튼·입력 */
  .btn{min-height:48px;border-radius:13px;font-weight:700;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:1rem}
  .btn.primary{background:var(--ink);color:#fff} .btn.accent{background:var(--accent);color:#fff} .btn.blue{background:var(--blue);color:#fff}
  .btn.soft{background:#f0f0f0} .btn.line{border:1px solid #ddd} .btn.block{width:100%} .btn.sm{min-height:38px;font-size:.92rem;padding:0 12px;border-radius:11px}
  .btn:disabled{opacity:.5}
  .btn.danger{color:#c33}
  .field{margin:0 0 16px}
  .field>label,.lab{display:block;font-size:.9rem;font-weight:700;color:#444;margin-bottom:7px}
  .input{width:100%;border:1px solid #ddd;border-radius:13px;padding:12px 13px;font-size:1rem;background:#fff;min-height:48px}
  .input:focus{outline:2px solid #1a1a1a22;border-color:#999}
  textarea.input{min-height:96px;resize:vertical;line-height:1.55}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid #ddd;border-radius:22px;padding:0 14px;font-size:.95rem;min-height:40px;display:inline-flex;align-items:center;gap:5px;background:#fff}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.pon{background:#F3EEFF;color:var(--purple);border-color:#cdbdf2;font-weight:700}
  .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid #ddd;border-radius:13px;overflow:hidden}
  .seg>button{padding:12px 6px;text-align:center;font-size:.98rem;min-height:48px}
  .seg>button.on{background:var(--ink);color:#fff;font-weight:700}
  .seg.purple>button.on{background:#F3EEFF;color:var(--purple)}
  .seg3{grid-template-columns:1fr 1fr 1fr}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
  .tgl{width:52px;height:30px;border-radius:15px;background:#ccc;position:relative;flex-shrink:0;transition:.2s}
  .tgl::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
  .tgl.on{background:#2f9e5b}.tgl.on::after{left:25px}
  .thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .thumbs .t{width:84px;height:84px;border-radius:12px;overflow:hidden;position:relative;flex-shrink:0;background:#eee}
  .thumbs .t img{width:100%;height:100%;object-fit:cover}
  .thumbs .t .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
  .thumbs .add{width:84px;height:84px;border-radius:12px;border:2px dashed #ccc;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#999;font-size:.8rem;flex-shrink:0}

  /* 시트·페이지 */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;max-height:94vh;display:flex;flex-direction:column;animation:up .22s ease-out}
  .sheet.full{height:94vh}
  .sheet-hd{display:flex;align-items:center;padding:6px 6px;border-bottom:1px solid var(--line);min-height:56px;flex-shrink:0}
  .sheet-hd b{flex:1;text-align:center;font-size:1.08rem}
  .sheet-bd{overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));flex:1}
  .sheet-ft{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));flex-shrink:0}
  .page{position:fixed;inset:0;z-index:50;background:#fff;overflow-y:auto;max-width:480px;margin:0 auto;padding-bottom:30px}
  .hdbtn{font-weight:700;color:var(--blue);padding:0 12px;min-height:44px;font-size:1rem}
  .hdbtn:disabled{opacity:.4}

  /* 프로필 */
  .prof{padding:6px 16px 0}
  .prof .cnts{display:flex;flex:1;justify-content:space-around;text-align:center}
  .prof .cnts b{display:block;font-size:1.2rem}.prof .cnts span{font-size:.8rem;color:var(--sub)}
  .prof h3{margin:12px 0 0;font-size:1.1rem}
  .prof p{margin:2px 0 10px;font-size:.95rem;color:#444;line-height:1.55}
  .pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .ptabs{display:flex;border-top:1px solid var(--line);position:sticky;top:56px;background:#fff;z-index:5}
  .ptabs button{flex:1;display:flex;justify-content:center;align-items:center;gap:5px;padding:11px 0;color:#aaa;font-size:.9rem;min-height:46px}
  .ptabs button.on{color:var(--ink);border-top:2px solid var(--ink);margin-top:-1px;font-weight:700}
  .yr{font-size:.88rem;font-weight:900;padding:12px 14px 6px;color:#444;display:flex;justify-content:space-between}
  .yr span{font-weight:400;color:#999}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
  .grid button{aspect-ratio:1;overflow:hidden;background:#eee;position:relative}
  .grid img{width:100%;height:100%;object-fit:cover}
  .grid .multi{position:absolute;top:5px;right:5px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .grid .txt{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:8px;font-size:.82rem;background:#FFF5E2;color:#6b5320;text-align:center;line-height:1.4}
  .tl{padding:4px 16px 10px 16px}
  .tl-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f3f3f3}
  .tl-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .tl-item b{font-size:.98rem;display:block}.tl-item span{font-size:.85rem;color:var(--sub)}
  .sheetcard{background:#fff;border-radius:22px;margin:0 12px 14px;overflow:clip;box-shadow:var(--card-sh)}
  .famrow{display:flex;gap:6px;overflow-x:auto;padding:4px 10px 14px;scrollbar-width:none}
  .famrow::-webkit-scrollbar{display:none}
  .fm{width:84px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
  .fm b{font-size:.92rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fm span{font-size:.75rem;color:var(--sub);white-space:nowrap}
  .fm-add{width:64px;height:64px;border-radius:50%;border:2px dashed #cfcac4;color:#9a948d;display:flex;align-items:center;justify-content:center}
  .tagfeed .post{margin:0 0 10px;border-radius:0;box-shadow:none;border-bottom:8px solid var(--bg)}
  .famgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 14px}
  .famcard{border:1px solid var(--line);border-radius:18px;padding:16px 10px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px}
  .famcard b{font-size:1.05rem}.famcard span{font-size:.82rem;color:var(--sub)}
  .famcard .bd{font-size:.78rem;font-weight:700;color:#7b4bd1;background:#F3EEFF;border-radius:8px;padding:1px 8px}

  /* 편지 */
  .qcard{margin:6px 14px 6px;border-radius:18px;background:linear-gradient(135deg,#FFE9DC,#FFD9E4);padding:16px;width:calc(100% - 28px);text-align:left;display:block}
  .qcard small{font-size:.8rem;font-weight:700;color:#b2502c}
  .qcard .qt{display:block;font-size:1.2rem;font-weight:900;margin:6px 0 10px;line-height:1.45}
  .qcard .qa{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.85rem;color:#7a4a3a}
  /* 함께 기도해요 */
  .pray-hero{margin:0 12px 12px;border-radius:22px;padding:16px;background:linear-gradient(140deg,#EEF4FF,#F3EDFF 60%,#FFF1F4);display:flex;flex-direction:column;gap:6px;align-items:flex-start;box-shadow:var(--card-sh)}
  .pray-hero b{font-size:1.05rem}.pray-hero span{font-size:.9rem;color:#5d5874;margin-bottom:6px}
  .pray{background:#fff;border-radius:22px;margin:0 12px 12px;box-shadow:var(--card-sh);overflow:hidden;border:2px solid transparent}
  .pray.focus{border-color:#9C84E8}
