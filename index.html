<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── 아이콘 헬퍼 (Lucide CDN 지원용 파스칼 케이스 변환) ── */
const LIcon = ({ name, size = 16, className = '' }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current) {
      ref.current.innerHTML = '';
      
      // kebab-case (예: chevron-left)를 PascalCase (예: ChevronLeft)로 변환
      const pascalName = name
        .split('-')
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join('');
      
      const icon = lucide.icons[pascalName] || lucide[pascalName];
      if (icon) {
        const el = lucide.createElement(icon);
        el.setAttribute('width', size);
        el.setAttribute('height', size);
        if (className) el.setAttribute('class', className);
        ref.current.appendChild(el);
      }
    }
  }, [name, size, className]);
  return <span ref={ref} style={{display:'inline-flex',verticalAlign:'middle'}}/>;
};

/* ── 구글 API 설정 ── */
const GOOGLE_CLIENT_ID = "YOUR_CLIENT_ID.apps.googleusercontent.com";

/* ── 감성 기상예보 스펙트럼 ── */

  FLUTTER:  { icon:'🌸', title:'두근거림', color:'#A54042', levels:{ low:{label:'은은한 설렘',desc:'나는 지금 꽃잎 하나가 스쳐가는 봄바람을 느끼고 있어요.'}, mid:{label:'설렘 · 정겨움',desc:'나는 지금 따뜻한 봄날, 누군가와 나란히 걷고 있어요.'}, high:{label:'감동 · 충만함',desc:'나는 지금 노을이 가슴까지 물드는 저녁을 바라보고 있어요.'}}},
  VITALITY: { icon:'☀️', title:'생기',    color:'#B2873B', levels:{ low:{label:'기운 남',desc:'나는 지금 아침 햇살이 창문을 두드리는 소리에 깨어나고 있어요.'}, mid:{label:'신남 · 활기',desc:'나는 지금 바람을 가르며 여름 들판을 달리고 있어요.'}, high:{label:'환희 · 보람',desc:'나는 지금 눈부신 태양 아래서 수확한 열매를 품에 안고 있어요.'}}},
  ANXIETY:  { icon:'☁️', title:'걱정',    color:'#6A7D8F', levels:{ low:{label:'신경 쓰임',desc:'나는 지금 구름이 조금씩 모여드는 하늘을 올려다보고 있어요.'}, mid:{label:'초조함',desc:'나는 지금 비가 내리기 직전의 거리를 서성이고 있어요.'}, high:{label:'공포 · 압박',desc:'나는 지금 폭풍 전야의 바닷가에 홀로 서 있어요.'}}},
  ANGER:    { icon:'⛈️', title:'화남',    color:'#8C4F2B', levels:{ low:{label:'속상함',desc:'나는 지금 후텁지근한 공기 속에서 이마의 땀을 훔치고 있어요.'}, mid:{label:'화남',desc:'나는 지금 천둥소리가 점점 가까워지는 하늘 아래 서 있어요.'}, high:{label:'분노 폭발',desc:'나는 지금 번개가 하늘을 가르는 폭풍 한가운데에 있어요.'}}},
  SADNESS:  { icon:'🌧️', title:'그리움',  color:'#526A7A', levels:{ low:{label:'서운함',desc:'나는 지금 창문을 적시는 가을비를 바라보고 있어요.'}, mid:{label:'슬픔',desc:'나는 지금 하루 종일 비가 내리는 거리를 천천히 걷고 있어요.'}, high:{label:'절망',desc:'나는 지금 폭우가 내리는 깊은 밤을 지나고 있어요.'}}},
  LETHARGY: { icon:'❄️', title:'소진',    color:'#24221F', levels:{ low:{label:'지루함',desc:'나는 지금 해가 잘 들지 않는 겨울 오후에 앉아 있어요.'}, mid:{label:'허탈함',desc:'나는 지금 해가 일찍 저무는 겨울 저녁을 바라보고 있어요.'}, high:{label:'번아웃',desc:'나는 지금 눈도 오지 않는 겨울 벌판에 멈춰 서 있어요.'}}}
};

function App() {
  /* ── Cloud states ── */
  const [gapiInited, setGapiInited] = useState(false);
  const [gisInited, setGisInited]   = useState(false);
  const [isCloudConnected, setIsCloudConnected] = useState(false);
  const [appFolderId, setAppFolderId] = useState(null);
  const [dbFileId, setDbFileId]       = useState(null);
  const [isSyncing, setIsSyncing]     = useState(false);

  /* ── Core states ── */
  const [familyMembers, setFamilyMembers] = useState([
    {id:'1',name:'할머니',emoji:'👵',color:'#A54042',role:'세심한 관찰자'},
    {id:'2',name:'아빠',emoji:'👨',color:'#B2873B',role:'호기심 낚시꾼'},
    {id:'3',name:'엄마',emoji:'👩',color:'#486B56',role:'다정한 요리사'},
    {id:'4',name:'나',emoji:'🧒',color:'#24221F',role:'오늘의 기록관'}
  ]);
  const [activeTab, setActiveTab]     = useState('home');
  const [toastMessage, setToastMessage] = useState('');
  const [newsList, setNewsList]       = useState([]);
  const [moodForecast, setMoodForecast] = useState({});
  const [stickyNotes, setStickyNotes] = useState([]);
  const [currentDate, setCurrentDate] = useState(new Date(2026,5,11));
  const [calendarEvents, setCalendarEvents] = useState([]);
  const [memories, setMemories]       = useState([]);
  const [letters, setLetters]         = useState([]);

  /* ── Form states ── */
  const [isDossierModalOpen, setIsDossierModalOpen] = useState(false);
  const [editingMember, setEditingMember] = useState(null);
  const [newMemberName, setNewMemberName] = useState('');

  const [newMemberColor, setNewMemberColor] = useState('#A54042');
  const [newMemberRole, setNewMemberRole]   = useState('');
  const [isAddingNews, setIsAddingNews] = useState(false);
  const [newNewsTitle, setNewNewsTitle] = useState('');
  const [newNewsContent, setNewNewsContent] = useState('');
  const [newNewsAuthor, setNewNewsAuthor]   = useState('4');
  const [selectedImageFile, setSelectedImageFile] = useState(null);
  const [imagePreview, setImagePreview] = useState('');
  const [selectedMoodMember, setSelectedMoodMember] = useState('4');
  const [editingMoodCategory, setEditingMoodCategory] = useState('CALM');
  const [editingMoodLevel, setEditingMoodLevel] = useState('mid');
  const [editingMoodComment, setEditingMoodComment] = useState('');
  const [newStickyContent, setNewStickyContent] = useState('');
  const [newStickyAuthor, setNewStickyAuthor]   = useState('4');
  const [isAddingEvent, setIsAddingEvent] = useState(false);
  const [newEventTitle, setNewEventTitle] = useState('');
  const [newEventDate, setNewEventDate]   = useState('2026-06-11');
  const [newEventMember, setNewEventMember] = useState('3');
  const [shuffling, setShuffling]     = useState(false);
  const [dialRotation, setDialRotation] = useState(0);
  const [highlightedMemory, setHighlightedMemory] = useState(null);
  const [selectedLetter, setSelectedLetter] = useState(null);
  const [isWritingLetter, setIsWritingLetter] = useState(false);
  const [newLetterTitle, setNewLetterTitle]     = useState('');
  const [newLetterContent, setNewLetterContent] = useState('');
  const [newLetterSender, setNewLetterSender]     = useState('4');
  const [newLetterReceiver, setNewLetterReceiver] = useState('1');
  const tokenClientRef = useRef(null);

  /* ── Init ── */
  useEffect(() => {
    if (GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID !== "YOUR_CLIENT_ID.apps.googleusercontent.com") {
      const g1 = document.createElement('script'); g1.src="https://apis.google.com/js/api.js"; g1.async=true; g1.onload=initGapi; document.body.appendChild(g1);
      const g2 = document.createElement('script'); g2.src="https://accounts.google.com/gsi/client"; g2.async=true; g2.onload=initGis; document.body.appendChild(g2);
    } else { loadLocalFallback(); }
  }, []);

  const initGapi = () => { window.gapi.load('client', async()=>{ try{ await window.gapi.client.init({apiKey:GOOGLE_API_KEY,discoveryDocs:DISCOVERY_DOCS}); setGapiInited(true); }catch(e){console.error(e);} }); };
  const initGis = () => { try{ tokenClientRef.current=window.google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:SCOPES,callback:async(r)=>{if(r.error)return;setIsCloudConnected(true);showToast("구글 클라우드와 연결되었습니다.");await setupDriveArchitecture();}}); setGisInited(true); }catch(e){console.error(e);} };

  const setupDriveArchitecture = async()=>{
    setIsSyncing(true);
    try{
      let r=await window.gapi.client.drive.files.list({q:"mimeType='application/vnd.google-apps.folder' and name='THE FAMILY ZONE ARCHIVE' and trashed=false",fields:'files(id,name)'});
      let fId='';
      if(r.result.files.length>0){fId=r.result.files[0].id;}else{const fr=await window.gapi.client.drive.files.create({resource:{name:'THE FAMILY ZONE ARCHIVE',mimeType:'application/vnd.google-apps.folder'},fields:'id'});fId=fr.result.id;}
      setAppFolderId(fId);
      r=await window.gapi.client.drive.files.list({q:`name='diary_data.json' and '${fId}' in parents and trashed=false`,fields:'files(id,name)'});
      if(r.result.files.length>0){setDbFileId(r.result.files[0].id);await downloadDataFromCloud(r.result.files[0].id);}else{await createAndUploadInitialDB(fId);}
    }catch(e){console.error(e);showToast("드라이브 구조 생성 중 오류");}finally{setIsSyncing(false);}
  };

  const downloadDataFromCloud = async(fileId)=>{
    try{
      const r=await window.gapi.client.drive.files.get({fileId,alt:'media'});const d=r.result;
      if(d){if(d.familyMembers)setFamilyMembers(d.familyMembers);if(d.newsList)setNewsList(d.newsList);if(d.moodForecast)setMoodForecast(d.moodForecast);if(d.stickyNotes)setStickyNotes(d.stickyNotes);if(d.calendarEvents)setCalendarEvents(d.calendarEvents);if(d.memories)setMemories(d.memories);if(d.letters)setLetters(d.letters);}
      showToast("구글 드라이브에서 최신 수첩을 동기화했습니다.");
    }catch(e){console.error(e);}
  };

  const syncDataToCloud = async(cFId=appFolderId,cDbId=dbFileId,us=null)=>{
    if(!isCloudConnected||!cFId||!cDbId)return;setIsSyncing(true);
    const p=us||{familyMembers,newsList,moodForecast,stickyNotes,calendarEvents,memories,letters};

  };

  const createAndUploadInitialDB = async(fId)=>{
    const ip={familyMembers,newsList:[{id:'n1',authorId:'1',title:'앞뜰 화단의 들국화가 보름 일찍 피었단다',content:'아침 이슬을 털러 나갔더니 노란 들국화 한 송이가 수줍게 목을 밀어 올렸더구나.',date:'2026-06-11',imageUrl:'',reactions:{'❤️':3,'👍':2,'☕':4}}],moodForecast:{'1':{category:'CALM',level:'mid',comment:'고요한 기분'}},stickyNotes:[{id:'s1',authorId:'3',content:'냉장고에 매실액 타두었으니 시원하게 한 잔씩들 하거라!',color:'#F7F4EB',angle:-1.2}],calendarEvents:[{id:'e1',title:'엄마 생신 축하 잔치 💐',date:'2026-06-15',memberId:'3'}],memories:[{id:'m1',title:'가장 따뜻했던 가을 산책길',desc:'온 식구가 단풍 낙엽길을 밟으며 깔깔대던 가을 오후.',date:'2025-10-15',imageUrl:''}],letters:[{id:'l1',senderId:'3',receiverId:'4',title:'사랑하는 우리 막내에게',content:'밥은 거르지 말고 마음 한구석도 외롭게 두지 말거라.',date:'2026-06-08',isNew:true}]};
    try{const r=await window.gapi.client.drive.files.create({resource:{name:'diary_data.json',mimeType:'application/json',parents:[fId]},fields:'id'});const nfId=r.result.id;setDbFileId(nfId);await window.gapi.client.request({path:`/upload/drive/v3/files/${nfId}`,method:'PATCH',params:{uploadType:'media'},body:JSON.stringify(ip)});setNewsList(ip.newsList);setMoodForecast(ip.moodForecast);setStickyNotes(ip.stickyNotes);setCalendarEvents(ip.calendarEvents);setMemories(ip.memories);setLetters(ip.letters);showToast("구글 드라이브 마스터 다이어리가 개정되었습니다.");}catch(e){console.error(e);}
  };

  const uploadImageToDrive = async(file)=>{
    if(!isCloudConnected||!appFolderId)return"";
    try{const b64=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(file);});const bd='foo_bar_baz';const body=`\r\n--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:`photo_${Date.now()}_${file.name}`,parents:[appFolderId]})}\r\n--${bd}\r\nContent-Transfer-Encoding: base64\r\nContent-Type: ${file.type}\r\n\r\n${b64}\r\n--${bd}--`;const r=await window.gapi.client.request({path:'/upload/drive/v3/files',method:'POST',params:{uploadType:'multipart'},headers:{'Content-Type':`multipart/related; boundary=${bd}`},body});return`https://lh3.googleusercontent.com/d/${r.result.id}=w400`;}catch(e){console.error(e);return"";}
  };

  const loadLocalFallback = () => {

      const d = JSON.parse(local);

      ]);
      setMoodForecast({'1':{category:'CALM',level:'mid',comment:'조용히 숨 고르는 중'},'2':{category:'CALM',level:'low',comment:'바람 없는 아침 들판을 걷고 있어요.'},'3':{category:'VITALITY',level:'high',comment:'생기 충만한 기분 좋은 오동나무 아침'},'4':{category:'FLUTTER',level:'mid',comment:'설레는 발걸음으로 하루를 엽니다.'}});
      setStickyNotes([{id:'s1',authorId:'3',content:'냉장고에 매실액 타두었으니 시원하게 한 잔씩들 하거라!',color:'#F7F4EB',angle:-1.2},{id:'s2',authorId:'2',content:'오늘 밤 9시, 거실에서 모여 수박 깨자! 약속!',color:'#E4DCC9',angle:1.5}]);
      setCalendarEvents([{id:'e1',title:'엄마 생신 축하 잔치 💐',date:'2026-06-15',memberId:'3'},{id:'e2',title:'온가족 기쁨정원 청소날',date:'2026-06-21',memberId:'1'}]);
      setMemories([{id:'m1',title:'가장 따뜻했던 가을 산책길',desc:'온 식구가 단풍 낙엽길을 밟으며 깔깔대던 오후. 아빠가 갑자기 발을 잘못 디뎌 주르륵 미끄러지자 할머니가 소리 내어 호탕하게 웃으셨지.',date:'2025-10-15',imageUrl:''},{id:'m2',title:'비 오는 날의 한옥 처마 끝',desc:'수제 수제비를 함께 빚어 마당으로 떨어지는 낙숫물 소리를 조용히 들었다.',date:'2025-11-02',imageUrl:''}]);
      setLetters([{id:'l1',senderId:'3',receiverId:'4',title:'사랑하는 우리 막내에게 띄운다',content:'매일 이른 새벽 바쁜 걸음으로 집을 나서는 네 뒷모습을 보며 엄마 마음 한편이 늘 짠하단다. 밥은 거르지 않고 마음 한구석도 외롭게 두지 말거라. 네 방 창가에 작은 들국화 화분을 올려두었으니 저녁에 오면 보렴.',date:'2026-06-08',isNew:true}]);

                        </div>
                        <div className="bg-[#E4DCC9]/20 rounded-lg p-2 border border-[#24221F]/5 relative">
                          <p className="text-[11px] sm:text-xs font-semibold leading-relaxed text-[#24221F]/90 italic select-text text-justify" style={{wordBreak:'keep-all'}}>"{ld.desc}"</p>
                        </div>
                        {mood.comment && <div className="text-[10px] sm:text-[11px] text-[#24221F]/70 font-cozy pl-1 select-text"><span className="text-[#A54042] mr-1">↳</span><span>"{mood.comment}"</span></div>}
                      </div>
                    );
                  })}
                </div>

                <form onSubmit={handleUpdateMood} className="bg-[#F7F4EB] p-3 rounded-lg border border-[#24221F] space-y-2.5">
                  <div className="text-[10px] sm:text-xs font-bold text-[#A54042] border-b border-dashed border-[#24221F]/30 pb-1">✍️ 마음 풍경 일지 기입란</div>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div><label className="block text-[8px] sm:text-[10px] font-bold opacity-75 mb-0.5">식구</label><select value={selectedMoodMember} onChange={e=>setSelectedMoodMember(e.target.value)} className="w-full bg-[#E4DCC9] border border-[#24221F] p-1 rounded-md text-xs">{familyMembers.map(m=><option key={m.id} value={m.id}>{m.emoji} {m.name}</option>)}</select></div>
                    <div><label className="block text-[8px] sm:text-[10px] font-bold opacity-75 mb-0.5">강도</label><select value={editingMoodLevel} onChange={e=>setEditingMoodLevel(e.target.value)} className="w-full bg-[#E4DCC9] border border-[#24221F] p-1 rounded-md text-xs"><option value="low">낮음</option><option value="mid">중간</option><option value="high">높음</option></select></div>
                  </div>
                  <div><label className="block text-[8px] sm:text-[10px] font-bold opacity-75 mb-1">마음 스펙트럼</label>
                    <div className="grid grid-cols-4 gap-1">
                      {Object.keys(MOOD_SPECTRA).map(key=>{const m=MOOD_SPECTRA[key];return(
                        <button key={key} type="button" onClick={()=>setEditingMoodCategory(key)} className={`p-1.5 rounded border text-[10px] flex flex-col items-center justify-center transition-all ${editingMoodCategory===key?'bg-[#24221F] text-white border-[#24221F]':'bg-[#E4DCC9]/30 text-[#24221F] border-[#24221F]/15'}`}>
                          <span className="text-xs">{m.icon}</span><span className="text-[7px] sm:text-[8px] mt-0.5 tracking-tighter leading-none">{m.title}</span>
                        </button>
                      );})}
                    </div>
                  </div>
                  <div className="bg-[#E4DCC9]/40 p-2 rounded text-[10px] sm:text-[11px] italic" style={{wordBreak:'keep-all'}}>"{MOOD_SPECTRA[editingMoodCategory].levels[editingMoodLevel].desc}"</div>
                  <div><label className="block text-[8px] sm:text-[10px] font-bold opacity-75 mb-0.5">속삭임 한줄</label><input type="text" placeholder="사소한 일상을 적어두세요" value={editingMoodComment} onChange={e=>setEditingMoodComment(e.target.value)} className="w-full bg-[#E4DCC9]/40 border border-[#24221F] p-1.5 rounded text-xs"/></div>
                  <button type="submit" className="w-full bg-[#24221F] text-white py-1.5 rounded font-bold text-xs">내 기상 예보 발행 ✦</button>
                </form>
              </div>

              {/* 포스트잇 */}
              <div className="bg-[#E4DCC9]/45 rounded-xl sm:rounded-2xl p-4 sm:p-6 border border-dashed border-[#24221F]/80">
                <h2 className="text-base sm:text-lg font-bold tracking-tight mb-4">📌 포스트잇 한 줄 메모판</h2>
                <form onSubmit={handleAddSticky} className="mb-4 flex gap-1.5 items-center">
                  <input type="text" placeholder="냉장고 자석 쪽지 남기기..." value={newStickyContent} onChange={e=>setNewStickyContent(e.target.value)} className="flex-1 bg-[#F7F4EB] border border-[#24221F] rounded-lg px-2.5 py-2.5 text-xs focus:outline-none focus:ring-1 focus:ring-[#A54042]"/>
                  <button type="submit" className="bg-[#24221F] hover:bg-[#A54042] text-white p-2.5 rounded-lg transition-colors flex items-center justify-center shadow-[1.5px_1.5px_0px_#24221F] shrink-0" title="쪽지 고정하기"><LIcon name="pin" size={15}/></button>
                </form>
                <div className="space-y-3">
                  {stickyNotes.map(note=>(
                    <div key={note.id} className="p-3 rounded-xl border border-[#24221F] shadow-[1.5px_1.5px_0px_#24221F] relative" style={{backgroundColor:note.color,transform:`rotate(${note.angle}deg)`}}>
                      <div className="flex justify-between items-center text-[10px] opacity-65 mb-1">
                        <span>{getMember(note.authorId).emoji} {getMember(note.authorId).name}</span>
                        <button onClick={()=>handleDeleteSticky(note.id)}><LIcon name="x" size={13}/></button>
                      </div>
                      <p className="text-xs select-text">{note.content}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ═══ TAB 2: 시간의 나무 ═══ */}
        {activeTab==='calendar' && (
          <div className="bg-[#E4DCC9]/45 rounded-xl sm:rounded-2xl p-3 sm:p-6 border border-dashed border-[#24221F]/80 animate-fadeIn">
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 sm:gap-8">
              <div className="lg:col-span-2 bg-[#F7F4EB] border-2 border-[#24221F] rounded-xl sm:rounded-2xl p-3 sm:p-5 shadow-[3px_3px_0px_#24221F]">
                <div className="flex items-center justify-between border-b-2 border-[#24221F] pb-3 mb-3.5">
                  <h2 className="text-sm sm:text-base md:text-lg font-bold tracking-widest">{currentDate.getFullYear()}년 {currentDate.getMonth()+1}월 시간의 나무</h2>
                  {/* 월 변경 둥근 버튼 커스텀 조정 */}
                  <div className="flex gap-2">
                    <button 
                      onClick={handlePrevMonth} 
                      className="w-8 h-8 flex items-center justify-center border-2 border-[#24221F] rounded-full bg-[#E4DCC9] hover:bg-[#A54042] hover:text-[#F7F4EB] transition-all duration-200 shadow-[2px_2px_0px_#24221F] active:translate-y-[2px] active:shadow-none"
                      title="이전 달"
                    >
                      <LIcon name="chevron-left" size={16}/>
                    </button>
                    <button 
                      onClick={handleNextMonth} 
                      className="w-8 h-8 flex items-center justify-center border-2 border-[#24221F] rounded-full bg-[#E4DCC9] hover:bg-[#A54042] hover:text-[#F7F4EB] transition-all duration-200 shadow-[2px_2px_0px_#24221F] active:translate-y-[2px] active:shadow-none"
                      title="다음 달"
                    >
                      <LIcon name="chevron-right" size={16}/>
                    </button>
                  </div>
                </div>
                <div className="grid grid-cols-7 gap-1 text-center text-[10px] sm:text-xs font-bold border-b border-dashed pb-1.5 mb-2">
                  {['일','월','화','수','목','금','토'].map(d=><span key={d}>{d}</span>)}
                </div>
                <div className="grid grid-cols-7 gap-1 text-center text-xs min-h-[180px] sm:min-h-[220px]">
                  {(() => {
                    const y = currentDate.getFullYear(), mo = currentDate.getMonth();
                    const firstDay = new Date(y, mo, 1).getDay();
                    const daysInMonth = new Date(y, mo + 1, 0).getDate();
                    const cells = [];
                    for (let i = 0; i < firstDay; i++) cells.push(<div key={'e'+i} className="border border-transparent"/>);
                    for (let d = 1; d <= daysInMonth; d++) {
                      const dStr = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                      const evts = calendarEvents.filter(e => e.date === dStr);
                      cells.push(
                        <div key={d} className="border border-[#24221F]/15 rounded p-0.5 sm:p-1 flex flex-col justify-between items-start min-h-[36px] sm:min-h-[46px] bg-[#F7F4EB]">
                          <span className="font-bold text-[9px] sm:text-xs opacity-75">{d}</span>
                          <div className="w-full space-y-0.5">
                            {evts.map(e=><div key={e.id} className="text-[7px] sm:text-[9px] text-white px-0.5 rounded truncate" style={{backgroundColor:getMember(e.memberId).color}} title={e.title}>{e.title}</div>)}
                          </div>
                        </div>
                      );
                    }
                    return cells;
                  })()}
                </div>
              </div>
              <div className="space-y-4">
                <div className="bg-[#F7F4EB] border border-[#24221F] p-4 rounded-xl shadow-[2px_2px_0px_#24221F]">
                  <h3 className="text-xs sm:text-sm font-bold text-[#A54042] mb-2.5">🌳 시간의 나무 새 가지 심기</h3>
                  <form onSubmit={handleAddCalendarEvent} className="space-y-2 text-xs">
                    <input type="text" placeholder="소중한 날의 이름을 적어주세요 (예: 엄마 생신 💐)" value={newEventTitle} onChange={e=>setNewEventTitle(e.target.value)} className="w-full bg-[#E4DCC9]/40 border border-[#24221F] p-2 rounded-lg text-xs"/>
                    <input type="date" value={newEventDate} onChange={e=>setNewEventDate(e.target.value)} className="w-full bg-[#E4DCC9]/40 border border-[#24221F] p-2 rounded-lg text-xs"/>
                    <select value={newEventMember} onChange={e=>setNewEventMember(e.target.value)} className="w-full bg-[#E4DCC9] border border-[#24221F] p-2 rounded-lg text-xs">{familyMembers.map(m=><option key={m.id} value={m.id}>{m.emoji} {m.name}</option>)}</select>
                    <button type="submit" className="w-full bg-[#24221F] text-white py-2 rounded-lg font-bold">시간의 나무에 새겨넣기</button>
                  </form>
                </div>
                <div className="bg-[#F7F4EB] border border-[#24221F] p-4 rounded-xl shadow-[2px_2px_0px_#24221F] space-y-2">
                  <h3 className="text-xs sm:text-sm font-bold opacity-80">다가오는 일정</h3>
                  {calendarEvents.map(e=>(
                    <div key={e.id} className="flex justify-between items-center bg-[#E4DCC9]/45 p-2 rounded-lg text-xs border border-[#24221F]/10">
                      <div><div className="font-bold text-[11px] sm:text-xs">{e.title}</div><div className="text-[9px] opacity-65">{e.date}</div></div>
                      <span className="bg-[#A54042] text-white px-1.5 py-0.5 rounded text-[8px] sm:text-[9px] font-bold">{getDDay(e.date)}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ═══ TAB 3: 추억 산책로 ═══ */}
        {activeTab==='memory' && (
          <div className="space-y-6 animate-fadeIn">
            <div className="bg-[#E4DCC9]/45 rounded-xl sm:rounded-2xl p-4 sm:p-6 border border-dashed border-[#24221F]/80 grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 items-center">
              <div className="text-center p-4 bg-[#F7F4EB] border border-[#24221F] rounded-xl shadow-[2px_2px_0px_#24221F] flex flex-col items-center">
                <h3 className="text-xs sm:text-sm font-bold text-[#A54042] font-vintage-title mb-2">✦ MEMORY DIAL SHUFFLE ✦</h3>
                <div className="relative w-28 h-28 sm:w-36 sm:h-36 border-2 border-double border-[#24221F] rounded-full bg-[#E4DCC9] flex items-center justify-center transition-transform duration-1000" style={{transform:`rotate(${dialRotation}deg)`}}>
                  <button onClick={handleShuffleDial} disabled={shuffling} className="absolute w-12 h-12 sm:w-16 sm:h-16 bg-[#A54042] text-white font-bold rounded-full border border-[#24221F] text-[9px] sm:text-xs flex flex-col items-center justify-center shadow">
                    <LIcon name="refresh-cw" size={13}/><span>회전</span>
                  </button>
                </div>
              </div>
              <div>
                {highlightedMemory ? (
                  <div className="bg-[#24221F] text-[#E4DCC9] p-3 sm:p-4 rounded-xl shadow animate-fadeIn text-xs">
                    <span className="text-[#B2873B] block text-[9px] sm:text-[10px] mb-1">{highlightedMemory.date}자 회고</span>
                    <h4 className="text-sm sm:text-base font-bold text-white mb-1">{highlightedMemory.title}</h4>
                    <p className="opacity-80 text-[11px] sm:text-xs text-justify leading-relaxed" style={{wordBreak:'keep-all'}}>{highlightedMemory.desc}</p>
                  </div>
                ) : (
                  <div className="h-28 sm:h-32 border border-dashed border-[#24221F]/40 rounded-xl flex items-center justify-center text-xs opacity-60 text-center px-4 leading-normal">추억 산책로 다이얼을 돌려보세요.<br/>서랍 속 일기가 추출됩니다.</div>
                )}
              </div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
              {newsList.filter(n=>n.imageUrl).map((news,idx)=>(
                <div key={news.id} className="bg-[#F7F4EB] border border-[#24221F] p-3 shadow-[2px_2px_0px_#24221F] flex flex-col justify-between" style={{transform:`rotate(${idx%2===0?'-0.8deg':'0.8deg'})`}}>
                  <div className="bg-[#E4DCC9] aspect-square rounded-lg border border-[#24221F]/20 overflow-hidden relative"><img src={news.imageUrl} alt="폴라로이드" className="w-full h-full object-cover"/></div>
                  <div className="pt-2.5 border-t border-dashed border-[#24221F]/15 mt-3 text-xs">
                    <div className="text-[9px] opacity-60 mb-1">{news.date} 기록</div>
                    <h4 className="font-bold text-[#A54042] truncate">{news.title}</h4>
                    <p className="opacity-75 text-[10px] sm:text-[11px] line-clamp-2 mt-0.5">{news.content}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ═══ TAB 4: 마음 우체국 ═══ */}
        {activeTab==='note' && (
          <div className="space-y-6 animate-fadeIn">
            <div className="bg-[#E4DCC9]/45 rounded-xl sm:rounded-2xl p-4 sm:p-6 border border-dashed border-[#24221F]/80">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-0 border-b-2 border-[#24221F] pb-3 mb-4 sm:mb-6">
                <div className="flex items-center gap-1.5"><span className="text-lg sm:text-xl">💌</span><h2 className="text-base sm:text-lg md:text-xl font-bold tracking-tight">마음 우체국 따뜻한 편지함</h2></div>
                <button onClick={()=>setIsWritingLetter(!isWritingLetter)} className="w-full sm:w-auto flex items-center justify-center gap-1.5 bg-[#24221F] text-white text-xs px-4 py-2 rounded-xl shadow-[2px_2px_0px_#B2873B] font-bold"><LIcon name="edit-3" size={13}/><span>새로운 편지 띄우기</span></button>
              </div>

              {isWritingLetter && (
                <form onSubmit={handleAddLetter} className="bg-[#F7F4EB] border border-[#24221F] p-4 rounded-xl shadow max-w-xl mx-auto space-y-3 text-xs mb-6">
                  <div className="grid grid-cols-2 gap-2">
                    <select value={newLetterSender} onChange={e=>setNewLetterSender(e.target.value)} className="bg-[#E4DCC9] border border-[#24221F] p-1.5 rounded-lg text-xs">{familyMembers.map(m=><option key={m.id} value={m.id}>발신: {m.name}</option>)}</select>
                    <select value={newLetterReceiver} onChange={e=>setNewLetterReceiver(e.target.value)} className="bg-[#E4DCC9] border border-[#24221F] p-1.5 rounded-lg text-xs">{familyMembers.map(m=><option key={m.id} value={m.id}>수신: {m.name}</option>)}</select>
                  </div>
                  <input type="text" placeholder="편지 제목" value={newLetterTitle} onChange={e=>setNewLetterTitle(e.target.value)} className="w-full bg-[#E4DCC9]/40 border border-[#24221F] p-2 rounded-lg text-xs"/>
                  <textarea rows="4" placeholder="꾹꾹 눌러쓸 편지 서사" value={newLetterContent} onChange={e=>setNewLetterContent(e.target.value)} className="w-full bg-[#E4DCC9]/40 border border-[#24221F] p-2 rounded-lg text-xs"/>
                  <button type="submit" className="w-full bg-[#24221F] text-white py-2 rounded-lg font-bold shadow-[2px_2px_0px_#24221F]">마음 우체통에 봉인 투입</button>
                </form>
              )}

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {letters.map(letter=>(
                  <div key={letter.id} onClick={()=>setSelectedLetter(letter)} className="bg-[#F7F4EB] border border-[#24221F] p-4 rounded-xl shadow-[2px_2px_0px_#24221F] cursor-pointer hover:-translate-y-0.5 transition-all relative">
                    <div className="text-[9px] opacity-60 mb-1">From. {getMember(letter.senderId).name} ➔ To. {getMember(letter.receiverId).name}</div>
                    <h3 className="font-bold text-sm sm:text-base text-[#24221F] truncate">{letter.title}</h3>
                    <p className="text-xs opacity-75 line-clamp-2 mt-1 leading-normal">{letter.content}</p>
                  </div>
                ))}
              </div>
            </div>

            {selectedLetter && (
              <div className="fixed inset-0 bg-[#24221F]/75 z-50 flex items-center justify-center p-3 sm:p-4" style={{backdropFilter:'blur(4px)'}} onClick={e=>{if(e.target===e.currentTarget)setSelectedLetter(null)}}>
                <div className="bg-[#F7F4EB] border-2 border-[#24221F] p-5 rounded-[20px] shadow-[4px_4px_0px_#A54042] max-w-md w-full relative select-text max-h-[85vh] overflow-y-auto animate-fadeIn">
                  <button onClick={()=>setSelectedLetter(null)} className="absolute top-4 right-4 border border-[#24221F] rounded-full p-1"><LIcon name="x" size={13}/></button>
                  <h2 className="text-base sm:text-lg font-bold border-b pb-1.5 mb-2.5 text-[#24221F] pr-6">{selectedLetter.title}</h2>
                  <div className="text-[10px] opacity-70 mb-3">날짜: {selectedLetter.date} | 보낸이: {getMember(selectedLetter.senderId).name}</div>
                  <p className="text-xs sm:text-sm bg-[#E4DCC9]/20 border border-[#24221F]/10 p-3 rounded-xl whitespace-pre-line leading-relaxed text-justify" style={{wordBreak:'keep-all'}}>{selectedLetter.content}</p>
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* 식구 편집 모달 */}
      {isDossierModalOpen && (
        <div className="fixed inset-0 bg-[#24221F]/75 z-50 flex items-center justify-center p-3 sm:p-4" style={{backdropFilter:'blur(4px)'}} onClick={e=>{if(e.target===e.currentTarget)closeDossierModal()}}>
          <div className="bg-[#F7F4EB] border-2 border-[#24221F] p-5 rounded-[20px] max-w-md w-full relative max-h-[85vh] overflow-y-auto animate-fadeIn">
            <button onClick={closeDossierModal} className="absolute top-4 right-4 border border-[#24221F]/50 rounded-full p-1"><LIcon name="x" size={13}/></button>
            <h3 className="text-base sm:text-lg font-bold border-b pb-2 mb-3.5 text-center">식구 등록 및 아카이브 수정</h3>
            <div className="space-y-1.5 mb-4 max-h-36 overflow-y-auto border-b border-dashed border-[#24221F]/20 pb-3 pr-1">
              {familyMembers.map(m=>(
                <div key={m.id} className="flex justify-between items-center bg-[#E4DCC9]/30 p-2 rounded-lg text-xs border border-[#24221F]/15">
                  <span className="font-bold">{m.emoji} {m.name} <span className="font-normal opacity-60 text-[10px]">({m.role})</span></span>
                  <div className="flex gap-2 text-[10px]">
                    <button type="button" onClick={()=>{setEditingMember(m);setNewMemberName(m.name);setNewMemberRole(m.role);setNewMemberEmoji(m.emoji);setNewMemberColor(m.color);}} className="text-[#B2873B] font-bold">수정</button>
                    <button type="button" onClick={()=>handleDeleteMember(m.id,m.name)} className="text-[#A54042] font-bold">삭제</button>
                  </div>
                </div>
              ))}
            </div>
            <form onSubmit={handleSaveMember} className="bg-[#E4DCC9]/20 p-3 sm:p-4 rounded-xl border border-[#24221F]/30 space-y-2 text-xs">
              <div className="grid grid-cols-2 gap-2">
                <input type="text" placeholder="식구 성명" value={newMemberName} onChange={e=>setNewMemberName(e.target.value)} className="w-full bg-[#F7F4EB] border p-1.5 rounded-lg text-xs"/>
                <input type="text" placeholder="가문 직함" value={newMemberRole} onChange={e=>setNewMemberRole(e.target.value)} className="w-full bg-[#F7F4EB] border p-1.5 rounded-lg text-xs"/>
              </div>
              <div className="flex justify-between items-center text-[10px] py-1.5">
                <span>아이콘 이모지:</span>
                <input type="text" value={newMemberEmoji} onChange={e=>setNewMemberEmoji(e.target.value)} className="w-10 bg-[#F7F4EB] text-center border rounded p-1"/>
                <div className="flex gap-1">
                  {['#A54042','#486B56','#B2873B','#24221F'].map(color=>(
                    <button key={color} type="button" onClick={()=>setNewMemberColor(color)} className={`w-3.5 h-3.5 rounded-full border ${newMemberColor===color?'border-black scale-110':'border-transparent'}`} style={{backgroundColor:color}}/>
                  ))}
                </div>
              </div>
              <button type="submit" className="w-full bg-[#24221F] text-white py-2 rounded-lg font-bold">{editingMember ? '프로필 수정 완료' : '새 식구 등록'}</button>
            </form>
          </div>
        </div>
      )}

      <footer className="mt-6 text-center text-[9px] sm:text-[10px] space-y-0.5 opacity-60 leading-normal">
        <div className="font-vintage-title">© 2026 THE FAMILY ZONE. INTEGRATED WITH GOOGLE DRIVE.</div>
        <div>"가장 완벽한 우리들만의 사적인 보금자리 서버 클라우드 갱지 수첩."</div>
      </footer>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
